name: CI

on:
  push:
    branches: [main, "beta/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# El repositorio **es** la raíz del producto (`apps/`, `infra/`, `tests/` en la
# raíz), así que el directorio de trabajo por defecto de cada paso ya es el
# correcto. Antes todos los pasos.usaban `working-directory: neural-news`, que
# no existe al hacer checkout: el CI fallaba en el primer paso.
jobs:
  # --- Backend ---------------------------------------------------------------
  api:
    name: API (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neural
          POSTGRES_PASSWORD: ""
          POSTGRES_DB: neuralnews
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neural"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEURAL_ENV: local
      NEURAL_DEMO_MODE: "true"
      NEURAL_DATABASE_URL: postgresql+psycopg://neural@127.0.0.1:5432/neuralnews
      NEURAL_ADMIN_PASSWORD: clave-de-prueba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Instalar el backend
        working-directory: apps/api
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Migraciones sobre PostgreSQL limpio
        working-directory: infra/migrations
        run: python -m alembic upgrade head
      - name: El esquema migrado coincide con los modelos
        run: python tools/compare_schema.py "$NEURAL_DATABASE_URL"
      - name: La suite pasa desde el directorio del API (sin depender del cwd)
        working-directory: apps/api
        run: python -m pytest -q ../../tests
      - name: Suite de pruebas
        run: python -m pytest -q
      - name: El contrato OpenAPI servido coincide con el exportado
        run: python tools/exportar_openapi.py --check
      - name: Escaneo de secretos
        run: python tools/scan_secrets.py .

  # --- Frontend --------------------------------------------------------------
  web:
    name: Web (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20"]
    env:
      NEURAL_ENV: local
      NEURAL_DEMO_MODE: "true"
      NEURAL_DATABASE_URL: sqlite:///./storage/neural-news-ci.db
      NEURAL_ADMIN_PASSWORD: clave-de-prueba
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar la web
        run: npm ci --no-audit --no-fund
      - name: Tipos
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npm run build
      - name: El build sin destino debe fallar (gate G5)
        env:
          NEURAL_ENV: beta
        run: |
          if npm run build; then
            echo "::error::el build ha compilado sin NEURAL_API_URL: la web se desplegaría sin destino"
            exit 1
          fi
          echo "OK: el build falla sin destino, como debe."
      - name: El mapa de estados generado está al día
        working-directory: .
        run: python tools/generate_estados.py --check
      - name: El plan con casillas está al día (lo valida el supervisor externo)
        working-directory: .
        run: python tools/generar_plan_casillas.py --check
      - name: El manifiesto de integridad del Studio está al día
        working-directory: .
        run: python tools/generar_manifiesto_studio.py --check
      - name: Ninguna clase propia inexistente ni reimplementada en línea
        working-directory: .
        run: python tools/check_clases.py
      - name: Auditoría de accesibilidad sin bloqueantes
        working-directory: .
        run: python tools/check_a11y.py
      - name: Preparar el navegador
        run: npx playwright install --with-deps chromium
      - name: E2E (levanta API, worker y web)
        run: npm run e2e
