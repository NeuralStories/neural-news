[project]
name = "neuralnews"
version = "0.1.0"
description = "neural.news — motor editorial de investigación y guiones sobre IA (MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-multipart>=0.0.9",
    # Hash de contraseñas Argon2id (NN-117.5). Sin esta dependencia el sistema
    # cae a PBKDF2-SHA256, que sigue funcionando.
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
]

[project.scripts]
neuralnews-api = "neuralnews.main:run"
neuralnews-worker = "neuralnews.worker:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# La configuración de pytest vive en el `pytest.ini` de la RAÍZ del repositorio
# (NN-114.6). Si se declarase aquí, pytest tomaría `apps/api` como raíz y los
# imports `from tests.… import …` volverían a fallar al ejecutar la suite
# desde este directorio.
