[project]
name = "neuralnews"
version = "1.0.0-beta.1"
description = "neural.news — motor editorial de investigación y guiones sobre IA (MVP)"
requires-python = ">=3.12"
dependencies = [
    # FastAPI está **acotado por arriba** a propósito: `docs/openapi.json` es un
    # artefacto versionado y el test `test_openapi_exportado` lo compara con el
    # contrato que sirve la aplicación. Sin el límite, una instalación nueva
    # puede resolver otra versión mayor y el contrato guardado deja de cuadrar
    # (hallazgo de la auditoría A1: FastAPI 0.115.8 en el equipo de entrega y
    # 0.162.0 en el clon limpio generaban esquemas distintos).
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-multipart>=0.0.9",
    # Hash de contraseñas Argon2id (NN-117.5). Sin esta dependencia el sistema
    # cae a PBKDF2-SHA256, que sigue funcionando.
    "argon2-cffi>=23.1",
    # Pillow: la usa `services/graphics.py` (tarjeta de gráfico PNG 1080x1920 y
    # zonas seguras). Los imports son perezosos, así que la aplicación arranca
    # sin ella, pero la función falla; y, sin declararla, **dos tests no se
    # pueden recoger** y pytest aborta la suite entera en una instalación limpia
    # (hallazgo de la auditoría A1: el repositorio no era autosuficiente).
    "Pillow>=10.0",
    # Cifrado de la bóveda de secretos (`services/vault.py`, NN-117.3): sin
    # ella, la aplicación arranca pero **ocho tests de la bóveda fallan** en una
    # instalación limpia (hallazgo de la auditoría A1: el propio código la daba
    # por declarada en un comentario que era falso).
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
]

[project.scripts]
neuralnews-api = "neuralnews.main:run"
neuralnews-worker = "neuralnews.worker:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# La configuración de pytest vive en el `pytest.ini` de la RAÍZ del repositorio
# (NN-114.6). Si se declarase aquí, pytest tomaría `apps/api` como raíz y los
# imports `from tests.… import …` volverían a fallar al ejecutar la suite
# desde este directorio.
