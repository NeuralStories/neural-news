[pytest]
# Configuración **en la raíz del repositorio** (NN-114.6).
#
# Antes sólo `apps/api/pyproject.toml` declaraba `testpaths = ["../../tests"]`,
# y desde ese directorio las pruebas que hacen `from tests.… import …`
# fallaban con `ModuleNotFoundError`: la suite **dependía del directorio** desde
# el que se ejecutaba. Con `pythonpath = .` (raíz del repositorio) los imports
# resuelven siempre, se ejecute la suite desde donde se ejecute.
testpaths = tests
pythonpath = .
addopts = -q
timeout = 120
filterwarnings =
    ignore::DeprecationWarning
